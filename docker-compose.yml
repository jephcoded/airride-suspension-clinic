services:
  db:
    image: postgres:16-alpine
    container_name: airride-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airride
      POSTGRES_PASSWORD: airride
      POSTGRES_DB: airride
    ports:
      - "5433:5432"
    volumes:
      - airride-db:/var/lib/postgresql/data

volumes:
  airride-db:
