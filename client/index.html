<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Airride" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1b33" />
    <meta name="description" content="__PAGE_DESC__" />
    <link rel="canonical" href="__SITE_URL____PAGE_PATH__" />
    <!-- Link previews (WhatsApp, Facebook, X, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Airride Suspension Clinic" />
    <meta property="og:title" content="__PAGE_TITLE__" />
    <meta property="og:description" content="__PAGE_DESC__" />
    <meta property="og:url" content="__SITE_URL____PAGE_PATH__" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Sora:wght@500;600;700;800&family=Saira:ital,wght@1,700;1,800&display=swap" rel="stylesheet" />
    <title>__PAGE_TITLE__</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRepair",
        "@id": "__SITE_URL__/#business",
        "name": "Airride Suspension Clinic",
        "url": "__SITE_URL__/",
        "logo": "__SITE_URL__/icon-512.png",
        "image": "__SITE_URL__/og-image.jpg",
        "description": "Air suspension, hydraulic suspension, shock absorber and automatic transmission repair, rebuilding and diagnostics. Book online and track your repair live.",
        "telephone": "+2347033060775",
        "email": "airridesuspensionclinic@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Lagos", "addressRegion": "Lagos", "addressCountry": "NG" },
        "areaServed": { "@type": "Country", "name": "Nigeria" },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], "opens": "08:00", "closes": "18:00" }
        ],
        "potentialAction": { "@type": "ReserveAction", "target": "__SITE_URL__/book", "name": "Book a repair" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
